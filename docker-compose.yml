# Oracle REST Data Services (ORDS) with Oracle APEX, connected to the database
# of the aviation-otp-observatory project. On its first start the container
# installs ORDS and APEX into that database, then serves:
#   http://localhost:8181/ords/          APEX and the REST API
name: otp-apex

services:
  ords:
    image: ${ORDS_IMAGE:-container-registry.oracle.com/database/ords:latest}
    container_name: otp-ords
    ports:
      # 127.0.0.1 only: the app and its API are not exposed to the local network.
      - "127.0.0.1:${ORDS_PORT:-8181}:8181"
    volumes:
      # conn_string.txt (written by "python apex.py up"); the container deletes it after use.
      - ./.secrets:/opt/oracle/variables
      # ORDS configuration created on the first start, kept across restarts.
      - ords_config:/etc/ords/config
    networks:
      - otp

networks:
  # The default network of the aviation-otp-observatory project: the database is
  # reachable there as host "oracle".
  otp:
    external: true
    name: otp-observatory_default

volumes:
  ords_config:
