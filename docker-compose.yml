# Oracle REST Data Services (ORDS) for Oracle APEX, connected to the database
# of the aviation-otp-observatory project. "python apex.py up" installs APEX and
# ORDS into that database the first time, then starts this container, which serves:
#   http://localhost:8181/ords/          APEX and the REST API
name: otp-apex

services:
  ords:
    # The image is used as a Java 17 runtime that works without AVX2. The ORDS that
    # runs is 26.3.1, from Oracle's zip in .cache/ords (see ORDS_VERSION in apex.py):
    # the ORDS 24.4 inside the image does not recognise Oracle AI Database 26ai.
    image: ${ORDS_IMAGE:-container-registry.oracle.com/database/ords:24.4.0}
    container_name: otp-ords
    entrypoint: ["bash", "/opt/ords-app/bin/ords"]
    command: ["--config", "/etc/ords/config", "serve"]
    ports:
      # 127.0.0.1 only: the app and its API are not exposed to the local network.
      # ORDS listens on 8080 inside the container.
      - "127.0.0.1:${ORDS_PORT:-8181}:8080"
    volumes:
      # ORDS configuration written by "ords install", kept across restarts.
      - ords_config:/etc/ords/config
      # APEX static files (JavaScript, CSS, icons), served as /i/.
      # ",z": SELinux label so the container may read the folder (Fedora).
      - ./.cache/apex/images:/opt/oracle/apex/images:ro,z
      # ORDS 26.3.1, unzipped by apex.py.
      - ./.cache/ords:/opt/ords-app:ro,z
    networks:
      - otp

networks:
  # The default network of the aviation-otp-observatory project: the database is
  # reachable there as host "oracle".
  otp:
    external: true
    name: otp-observatory_default

volumes:
  ords_config:
